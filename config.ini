[game]
; Game shown when the page opens for the first time: mega_millions or powerball.
; Switch any time with the "Game" dropdown at the top of the page (the last
; choice is remembered). Each game uses its own data file below.
; New Jersey plays the same national Powerball game, so "powerball" covers NJ.
name = powerball

[data]
; Folder is relative to the project root unless you give an absolute path.
folder = data
mega_millions_filename = Mega_Millions_3_Year_Advanced_Pattern_Analysis.xlsx
powerball_filename = Powerball_Draw_History.xlsx

; Only use draws from the last N years (counted back from the newest draw)
; when the app has to calculate hot/overdue/pair statistics itself.
; 0 = use every draw in the file.
years = 3

; How many top entries to pull from each analysis sheet when building
; the strategy pools. Tune these for "more dynamics" without touching code.
hot_count = 12
overdue_count = 12
pair_count = 10

[app]
host = 127.0.0.1
port = 5000
debug = false

[ai]
; "Suggestion" in the Most-Drawn Numbers section.
; The built-in analysis always works. For a suggestion written by Claude,
; set the ANTHROPIC_API_KEY environment variable (do NOT put the key in this
; file - it is packed into the .exe). Each click costs a fraction of a cent.
enabled = true
model = claude-sonnet-5-5
; seconds to wait for Claude before falling back to the built-in analysis
timeout = 45
